name: CI

on:
  push:
    branches: [main, "verify/*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      # Fail the build on a misconfigured deploy instead of the first webhook or cron
      # trigger. REQUIRE_CRON_SECRET proves the scheduled path has a secret too, which a
      # plain build would not (the route fails closed at runtime, so build alone passes).
      - name: Verify deploy environment contract
        run: pnpm run check:deploy-env
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          MIDTRANS_SERVER_KEY: "SB-Mid-server-testkey"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-testkey"
          MIDTRANS_IS_PRODUCTION: "false"
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          CRON_SECRET: "ci-cron-secret-at-least-32-characters-long"
          REQUIRE_CRON_SECRET: "true"

      - name: Test Production Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          MIDTRANS_SERVER_KEY: "SB-Mid-server-testkey"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-testkey"
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          MIDTRANS_IS_PRODUCTION: "false"
          CRON_SECRET: "ci-cron-secret-at-least-32-characters-long"

  integration-test:
    name: PostgreSQL Integration & Concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saas_starterkit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_starterkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration suites migrate the database themselves, so they must run against
      # a database that has never been migrated. Verify the drizzle-kit CLI path on a
      # separate clean database instead, then leave `saas_starterkit_test` pristine so
      # the suites exercise (and the CI guards) the concurrent-migration path.
      - name: Create database for the migration-CLI check
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const admin = postgres("postgresql://postgres:postgrespassword@127.0.0.1:5433/postgres", { max: 1 });
            await admin.unsafe("CREATE DATABASE saas_starterkit_test_migrate_check");
            await admin.end();
          '

      - name: Verify migrations apply to a clean database
        run: pnpm run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5433/saas_starterkit_test_migrate_check"

      - name: Run PostgreSQL Integration Tests
        run: |
          pnpm run test:integration 2>&1 | tee test-output.log || {
            echo "### Integration Test Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
        env:
          INTEGRATION_TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5433/saas_starterkit_test"
          NODE_ENV: "test"
          BETTER_AUTH_SECRET: "ci-integration-test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          MIDTRANS_SERVER_KEY: "SB-Mid-server-test-integration-key-32chars"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-test-integration-key"
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          MIDTRANS_IS_PRODUCTION: "false"
